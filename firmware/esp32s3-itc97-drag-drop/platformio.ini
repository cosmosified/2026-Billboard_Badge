; ESP32-S3 (8 MB flash / 8 MB PSRAM), Pervasive iTC 9.7" panel.
; One native USB socket: mass-storage drop box and the serial log.
; There is no hardware UART. COM22 is that USB serial port.
; Later updates: copy .pio/build/drop/firmware.bin onto EPD97.
;
;   pio run -t upload

[platformio]
default_envs = drop

[env:drop]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Original badge: 8 MB QIO flash, 8 MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_8MB.csv
board_upload.flash_size         = 8MB
board_upload.maximum_size       = 3342336

; The board file forces USB-Serial/JTAG (ARDUINO_USB_MODE=1). The drop drive
; and the log share the USB-OTG controller: MSC plus CDC, no UART.
build_unflags =
  -DARDUINO_USB_MODE=1

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_LOOP_STACK_SIZE=16384
  ; PNGdec's default line buffer is ~320 px. A dropped photo is wider than that.
  -DPNG_MAX_BUFFERED_PIXELS=262144
  -DEPD_PWR_ACTIVE_HIGH=0
  -DEPD_RUN_REFRESH=0

lib_deps =
  bitbank2/JPEGDEC
  bitbank2/PNGdec

monitor_speed = 115200
upload_speed  = 460800
; The native USB enumerates the log as a CDC serial port. On this
; machine that is COM23. There is no hardware UART.
upload_port   = /dev/ttyACM0
monitor_port  = /dev/ttyACM0

board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset
