; ESP32-S3 (8 MB flash / 8 MB PSRAM) driving a Pervasive iTC 9.7" dual-COG panel.
;
;   pio run -t upload              the page demo (default)
;   pio run -e changes -t upload   back-to-back fast refreshes, everything moving
;   pio run -e sleep   -t upload   one image a minute, panel and ESP32 asleep

[platformio]
default_envs = pages

[env]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Original badge: 8 MB QIO flash, 8 MB OPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.partitions          = default_8MB.csv
board_upload.flash_size         = 8MB
board_upload.maximum_size       = 3342336

build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Panel supply switch sense: SK2301AA1SHB P-channel high-side MOSFET on the
  ; EPD VCC, gate straight off GPIO17, so LOW turns it on.
  -DEPD_PWR_ACTIVE_HIGH=0

monitor_speed = 115200
upload_speed  = 460800

upload_port = /dev/ttyACM0
; If the board has to be held in download mode by hand, set after_reset to
; no_reset so esptool leaves it in the bootloader. before_reset must stay at
; default_reset either way - esptool needs the handshake to sync, and with
; no_reset there it fails with "No serial data received".
board_upload.before_reset = default_reset
board_upload.after_reset  = hard_reset

[env:pages]
build_flags = ${env.build_flags} -DDEMO_MODE=0

[env:changes]
build_flags = ${env.build_flags} -DDEMO_MODE=1

[env:sleep]
build_flags = ${env.build_flags} -DDEMO_MODE=2
; Seconds between images. The whole cycle lands on this, not on this plus the
; refresh - the sleep is shortened by however long the board was awake.
  -DDEMO_PERIOD_S=20

[env:lsfr]
build_flags = ${env.build_flags} -DDEMO_MODE=3

[env:never]
build_flags = ${env.build_flags} -DDEMO_MODE=4
